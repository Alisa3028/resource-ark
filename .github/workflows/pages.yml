name: Deploy to GitHub Pages

# 纯静态站点，无需构建步骤：直接把仓库内容整体发布到 GitHub Pages。
# 使用方式：仓库 Settings → Pages → Source 选择 "GitHub Actions"，然后推送到 main 分支。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 关键一步：页面读的是「构建产物」data/resources.json，而不是 data/shards/*.json。
      # 所以在 GitHub 网页上改完 shards 之后，必须由这里重新构建一次才会真的生效。
      # 两个脚本都只用标准库（json / os / re / datetime / random），不需要装任何包。
      - name: Build data from shards
        run: |
          python tools/build-data.py
          python tools/build-changelog.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 构建完的兜底检查：万一 shards 写坏了，宁可部署失败也不要上线一个空站
      - name: Verify data files
        run: |
          test -s data/resources.json || (echo "data/resources.json 为空，构建失败" && exit 1)
          test -s assets/js/data-fallback.js || (echo "缺少本地兜底数据" && exit 1)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
